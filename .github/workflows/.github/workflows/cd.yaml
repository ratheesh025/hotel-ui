name: Hotel UI - Kubernetes CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | \
          docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ratheesh2528/hotel-ui:${{ github.sha }} \
            -t ratheesh2528/hotel-ui:latest .

      # 4. Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ratheesh2528/hotel-ui:${{ github.sha }}
          docker push ratheesh2528/hotel-ui:latest

      # 5. Check Kubernetes access
      - name: Check Kubernetes cluster
        run: |
          kubectl get nodes
          kubectl get pods -n frontend

      # 6. Update existing Kubernetes Deployment
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/user-ui \
            user-ui=ratheesh2528/hotel-ui:${{ github.sha }} \
            -n frontend

      # 7. Wait for rollout
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/user-ui \
            -n frontend \
            --timeout=120s

      # 8. Verify deployment
      - name: Verify deployment
        run: |
          echo "Deployment:"
          kubectl get deployment user-ui -n frontend

          echo "Pods:"
          kubectl get pods -n frontend -l app=user-ui

          echo "Current image:"
          kubectl get deployment user-ui \
            -n frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo

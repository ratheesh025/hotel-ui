
name: Hotel UI - CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ==========================================
  # 1. CI - Build and Push Docker Image
  # ==========================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/hotel-ui:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/hotel-ui:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/hotel-ui:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/hotel-ui:latest

      - name: Build Complete
        run: |
          echo "================================="
          echo "Docker Build and Push Completed"
          echo "================================="
          echo "Image:"
          echo "${{ secrets.DOCKER_USERNAME }}/hotel-ui:${{ github.sha }}"


  # ==========================================
  # 2. CD - Deploy to Kubernetes
  # ==========================================
  deploy:
    name: Deploy Hotel UI to Kubernetes
    needs: build-and-push

    runs-on: [self-hosted, Linux, X64]

    steps:

      # ------------------------------------------
      # Checkout Code
      # ------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------
      # Check Runner
      # ------------------------------------------
      - name: Check Self-Hosted Runner
        run: |
          echo "================================="
          echo "Self-Hosted Runner"
          echo "================================="

          echo "Runner Hostname:"
          hostname

          echo "Runner User:"
          whoami

          echo "Docker Version:"
          docker --version

          echo "Kubectl Version:"
          kubectl version --client


      # ------------------------------------------
      # Check Kubernetes Cluster
      # ------------------------------------------
      - name: Check Kubernetes Cluster
        run: |
          echo "================================="
          echo "Kubernetes Nodes"
          echo "================================="

          kubectl get nodes

          echo "================================="
          echo "Frontend Namespace"
          echo "================================="

          kubectl get pods -n frontend


      # ------------------------------------------
      # Update Kubernetes Deployment
      # ------------------------------------------
      - name: Deploy New Image
        run: |
          kubectl set image deployment/user-ui \
            user-ui=${{ secrets.DOCKER_USERNAME }}/hotel-ui:${{ github.sha }} \
            -n frontend


      # ------------------------------------------
      # Wait for Rollout
      # ------------------------------------------
      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/user-ui \
            -n frontend \
            --timeout=120s


      # ------------------------------------------
      # Verify Deployment
      # ------------------------------------------
      - name: Verify Deployment
        run: |
          echo "================================="
          echo "Deployment"
          echo "================================="

          kubectl get deployment user-ui -n frontend

          echo "================================="
          echo "Pods"
          echo "================================="

          kubectl get pods \
            -n frontend \
            -l app=user-ui

          echo "================================="
          echo "Service"
          echo "================================="

          kubectl get svc user-ui -n frontend

          echo "================================="
          echo "Current Image"
          echo "================================="

          kubectl get deployment user-ui \
            -n frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo
          echo "================================="
          echo "Deployment Successful"
          echo "================================="
```

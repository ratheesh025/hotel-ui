
name: Hotel UI CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ==============================
  # 1. Build and Push Docker Image
  # ==============================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/hotel-ui:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/hotel-ui:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/hotel-ui:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/hotel-ui:latest

      - name: Show Image
        run: |
          echo "Docker image pushed successfully"
          echo "${{ secrets.DOCKER_USERNAME }}/hotel-ui:${{ github.sha }}"


  # ==============================
  # 2. Deploy to Kubernetes
  # ==============================
  deploy:
    name: Deploy to Kubernetes
    needs: build

    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Runner
        run: |
          echo "Runner:"
          hostname

          echo "User:"
          whoami

          echo "Docker:"
          docker --version

          echo "Kubectl:"
          kubectl version --client

      - name: Check Kubernetes
        run: |
          echo "Kubernetes Nodes:"
          kubectl get nodes

          echo "Frontend Namespace:"
          kubectl get pods -n frontend

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/user-ui \
            user-ui=${{ secrets.DOCKER_USERNAME }}/hotel-ui:${{ github.sha }} \
            -n frontend

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/user-ui \
            -n frontend \
            --timeout=120s

      - name: Verify Deployment
        run: |
          echo "================================="
          echo "Deployment"
          echo "================================="

          kubectl get deployment user-ui -n frontend

          echo "================================="
          echo "Pods"
          echo "================================="

          kubectl get pods -n frontend

          echo "================================="
          echo "Service"
          echo "================================="

          kubectl get svc user-ui -n frontend

          echo "================================="
          echo "Current Image"
          echo "================================="

          kubectl get deployment user-ui \
            -n frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo
          echo "================================="
          echo "CI/CD Deployment Successful"
          echo "================================="
```


name: Hotel UI Deployment

on:
  push:
    branches:
      - main

jobs:

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Get Source Code
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/hotel-ui:latest .

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/hotel-ui:latest


  deploy:
    name: Kubernetes Deployment
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:

      - name: Check Runner
        run: |
          echo "Runner Host:"
          hostname

          echo "Runner User:"
          whoami

      - name: Check Kubernetes
        run: |
          kubectl get nodes
          kubectl get pods -n frontend

      - name: Deploy Application
        run: |
          kubectl set image deployment/user-ui \
            user-ui=${{ secrets.DOCKER_USERNAME }}/hotel-ui:latest \
            -n frontend

      - name: Restart Deployment
        run: |
          kubectl rollout restart deployment/user-ui -n frontend

      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/user-ui \
            -n frontend \
            --timeout=120s

      - name: Check Final Status
        run: |
          echo "=============================="
          echo "PODS"
          echo "=============================="
          kubectl get pods -n frontend

          echo "=============================="
          echo "SERVICE"
          echo "=============================="
          kubectl get svc user-ui -n frontend

          echo "=============================="
          echo "DEPLOYMENT COMPLETE"
          echo "===========
